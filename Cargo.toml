# The procable runtime: one Cargo workspace next to the skill it powers.
# `cargo build --release -p procable` produces the engine binary the launcher
# (skill/scripts/procable) runs. See docs/ENGINE.md.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
procable-foundation = { path = "crates/foundation" }
procable-common = { path = "crates/common" }
procable-core = { path = "crates/core" }
procable-detect = { path = "crates/detect" }
procable-html = { path = "crates/html" }
procable-browser = { path = "crates/browser" }
procable-live = { path = "crates/live" }
procable-context = { path = "crates/context" }
procable-hook = { path = "crates/hook" }
procable-comp = { path = "crates/comp" }
procable-comp-verbs = { path = "crates/comp-verbs" }
procable-bundle = { path = "crates/bundle" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
regex = "1"
once_cell = "1"

# Dev and test builds keep file:line backtraces and drop the rest of the
# debuginfo, which is most of a target dir's size. Dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
